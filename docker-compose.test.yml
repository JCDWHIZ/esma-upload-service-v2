name: esma-upload-service-test

services:
  redis:
    image: redis:7-alpine
    container_name: gus-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - gus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: gus-seaweedfs-dev
    command: "server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333"
    ports:
      - "8333:8333" # S3 API gateway
      - "8888:8888" # Filer HTTP API
      - "9333:9333" # Master HTTP API
    volumes:
      - gus_seaweedfs_data:/data
      - ./ops/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    container_name: gus-clamav-dev
    ports:
      - "3310:3310"
    volumes:
      - gus_clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "10"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  gus_redis_data:
    name: gus_redis_data
  gus_seaweedfs_data:
    name: gus_seaweedfs_data
  gus_clamav_data:
    name: gus_clamav_data
