name: esma-upload-service-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: gus-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gus}
      POSTGRES_DB: ${POSTGRES_DB:-gus}
    ports:
      - "5432:5432"
    volumes:
      - gus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gus} -d $${POSTGRES_DB:-gus}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: gus-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - gus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── SeaweedFS S3 Gateway & Distributed Store (P2-04) ────────────────────────
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: gus-seaweedfs-dev
    command: "server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333"
    ports:
      - "8333:8333" # S3 API gateway
      - "8888:8888" # Filer HTTP API
      - "9333:9333" # Master HTTP API
    volumes:
      - gus_seaweedfs_data:/data
      - ./ops/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── Application (optional: used for local container smoke-testing) ───────────
  # Run `docker compose -f docker-compose.dev.yml up app` to boot the service
  # against the local Postgres and Redis instances.
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: gus-app-dev
    # init: true ensures SIGTERM is forwarded correctly to the Node process
    # (prevents PID 1 zombie issues when using `docker stop`).
    init: true
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-gus}:${POSTGRES_PASSWORD:-gus}@postgres:5432/${POSTGRES_DB:-gus}
      REDIS_URL: redis://redis:6379
      STAGING_DIR: /tmp/esma-staging
    ports:
      - "${PORT:-7030}:${PORT:-7030}"
    volumes:
      # Staging directory: files uploaded but not yet committed to storage.
      # A named volume keeps the container stateless while persisting in-flight
      # uploads across restarts (useful in dev; use ephemeral tmpfs in prod).
      - gus_staging_data:/tmp/esma-staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); http.get('http://localhost:${PORT:-7030}/health/live', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # ── ClamAV Antivirus Scanner (P5-07) ──────────────────────────────────────
  clamav:
    image: clamav/clamav:stable
    container_name: gus-clamav-dev
    profiles:
      - scan
    ports:
      - "3310:3310"
    volumes:
      - gus_clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "10"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  gus_postgres_data:
    name: gus_postgres_data
  gus_redis_data:
    name: gus_redis_data
  gus_staging_data:
    name: gus_staging_data
  gus_seaweedfs_data:
    name: gus_seaweedfs_data
  gus_clamav_data:
    name: gus_clamav_data

