name: esma-upload-service

services:
  # ── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: gus-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gus}
      POSTGRES_DB: ${POSTGRES_DB:-gus}
    ports:
      - "5432:5432"
    volumes:
      - gus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gus} -d $${POSTGRES_DB:-gus}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped

  # ── Redis Cache & Pub/Sub ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: gus-redis
    ports:
      - "6379:6379"
    volumes:
      - gus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

  # ── Database Migration Job ────────────────────────────────────────────────
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: gus-migrate
    command: ["npm", "run", "db:migrate"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-gus}:${POSTGRES_PASSWORD:-gus}@postgres:5432/${POSTGRES_DB:-gus}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── NestJS Primary API Service ───────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: gus-api
    init: true
    environment:
      NODE_ENV: development
      PORT: ${PORT:-7030}
      DATABASE_URL: postgres://${POSTGRES_USER:-gus}:${POSTGRES_PASSWORD:-gus}@postgres:5432/${POSTGRES_DB:-gus}
      REDIS_URL: redis://redis:6379
      STAGING_DIR: /tmp/esma-staging
    ports:
      - "${PORT:-7030}:${PORT:-7030}"
    volumes:
      - gus_staging_data:/tmp/esma-staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const port = process.env.PORT || 7030; http.get('http://localhost:' + port + '/health/live', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped

  # ── NestJS Background Worker Service ─────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: gus-worker
    command: ["npm", "run", "start:worker:prod"]
    init: true
    environment:
      NODE_ENV: development
      WORKER_HEALTH_PORT: ${WORKER_HEALTH_PORT:-7031}
      DATABASE_URL: postgres://${POSTGRES_USER:-gus}:${POSTGRES_PASSWORD:-gus}@postgres:5432/${POSTGRES_DB:-gus}
      REDIS_URL: redis://redis:6379
      STAGING_DIR: /tmp/esma-staging
    ports:
      - "${WORKER_HEALTH_PORT:-7031}:${WORKER_HEALTH_PORT:-7031}"
    volumes:
      - gus_staging_data:/tmp/esma-staging
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "const http = require('http'); const port = process.env.WORKER_HEALTH_PORT || 7031; http.get('http://localhost:' + port + '/health/live', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped

  # ── SeaweedFS Distributed Storage System (Profile: seaweedfs) ────────────
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: gus-seaweedfs
    profiles:
      - seaweedfs
    command: "server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -s3.port=8333 -master.port=9333 -filer.port=8888 -volume.port=8088 -defaultReplication=000"
    ports:
      - "8333:8333" # S3 API gateway
      - "8888:8888" # Filer HTTP API
      - "9333:9333" # Master HTTP API
      - "8088:8088" # Volume HTTP API (remapped to 8088 to prevent collision with Pulsar admin 8080)
    volumes:
      - gus_seaweedfs_data:/data
      - ./ops/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8333/"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    restart: unless-stopped

  seaweedfs-init:
    image: curlimages/curl:latest
    container_name: gus-seaweedfs-init
    profiles:
      - seaweedfs
    command: ["sh", "-c", "until curl -s -f http://seaweedfs:8333/ ; do sleep 1; done; curl -X PUT http://seaweedfs:8333/esma-uploads || true"]
    depends_on:
      seaweedfs:
        condition: service_healthy
    restart: "no"

  # ── Apache Kafka Event Broker (Profile: kafka) ───────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: gus-kafka
    profiles:
      - kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD", "opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    restart: unless-stopped

  # ── Apache Pulsar Event Broker (Profile: pulsar) ─────────────────────────
  pulsar:
    image: apachepulsar/pulsar:3.2.2
    container_name: gus-pulsar
    profiles:
      - pulsar
    command: bin/pulsar standalone
    ports:
      - "6650:6650"
      - "18080:8080" # Remapped from 8080 to 18080 to avoid collision with SeaweedFS volume port
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/admin/v2/clusters"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1536M
    restart: unless-stopped

  # ── ClamAV Antivirus Scanner (Profile: scan) ────────────────────────────
  clamav:
    image: clamav/clamav:stable
    container_name: gus-clamav
    profiles:
      - scan
    ports:
      - "3310:3310"
    volumes:
      - gus_clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "10"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
    restart: unless-stopped

  # ── Prometheus Metrics Collector (Profile: observability) ───────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: gus-prometheus
    profiles:
      - observability
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/alerts/prometheus-rules.yml:/etc/prometheus/alerts/prometheus-rules.yml:ro
      - gus_prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped

  # ── Grafana Dashboards (Profile: observability) ─────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: gus-grafana
    profiles:
      - observability
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./ops/dashboards:/var/lib/grafana/dashboards:ro
      - ./ops/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./ops/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - gus_grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    restart: unless-stopped

volumes:
  gus_postgres_data:
    name: gus_postgres_data
  gus_redis_data:
    name: gus_redis_data
  gus_staging_data:
    name: gus_staging_data
  gus_seaweedfs_data:
    name: gus_seaweedfs_data
  gus_clamav_data:
    name: gus_clamav_data
  gus_prometheus_data:
    name: gus_prometheus_data
  gus_grafana_data:
    name: gus_grafana_data
