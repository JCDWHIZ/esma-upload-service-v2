stages:
  - verify
  - build
  - deploy

variables:
  DOCKER_REGISTRY: "docker.io"
  IMAGE_NAME: "esma-upload-service-v2"
  DOCKER_IMAGE: ${DOCKER_USERNAME}/${IMAGE_NAME}:latest

default:
  image: node:22-bookworm
  tags:
    - esma

# Verify Stage: quality gates (typecheck, lint, unit, audit)
.verify_template: &verify_template
  stage: verify
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm install --frozen-lockfile

typecheck:
  <<: *verify_template
  script:
    - pnpm run typecheck

lint:
  <<: *verify_template
  script:
    - pnpm run lint
    - pnpm run format:check

unit:
  <<: *verify_template
  script:
    - pnpm run test
    - pnpm run test:integration
    - pnpm run test:reference

audit:
  <<: *verify_template
  script:
    - pnpm audit --prod --audit-level=high

# Build Stage: requires all verify jobs to succeed
build-and-push:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  needs:
    - typecheck
    - lint
    - unit
    - audit
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache nodejs npm curl git
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use
  script:
    - echo "Logging in to Docker Hub..."
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - echo "Building and pushing Docker image..."
    - |
      docker buildx build \
        --platform linux/arm64 \
        --push \
        -t $DOCKER_IMAGE \
        -t ${DOCKER_USERNAME}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA} \
        -f Dockerfile \
        .
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"

# Deploy Stage: deploys strictly from the default branch (main)
deploy-to-server:
  stage: deploy
  image: alpine:latest
  needs:
    - build-and-push
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Connecting to server and deploying..."
    - |
      ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST \
        "cd ~/server-setup/esma && \
        chmod +x ./restart && \
        ./restart"
    - echo "Deployment completed successfully"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: on_success
