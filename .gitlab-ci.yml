stages:
  - verify
  - integration
  - security
  - build
  - deploy-staging
  - deploy-production

variables:
  DOCKER_REGISTRY: "docker.io"
  IMAGE_NAME: "esma-upload-service-v2"
  DOCKER_IMAGE: ${DOCKER_USERNAME}/${IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}
  DOCKER_IMAGE_LATEST: ${DOCKER_USERNAME}/${IMAGE_NAME}:latest

default:
  image: node:22-bookworm
  tags:
    - esma

cache:
  key:
    files:
      - pnpm-lock.yaml
  paths:
    - .pnpm-store

.verify_template: &verify_template
  stage: verify
  before_script:
    - corepack enable
    - corepack prepare --activate
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile

# ── 1. Verify Stage ────────────────────────────────────────────────────────
typecheck:
  <<: *verify_template
  script:
    - pnpm run typecheck

lint:
  <<: *verify_template
  script:
    - pnpm run lint
    - pnpm run format:check

unit:
  <<: *verify_template
  script:
    - pnpm run test:unit

env-check:
  <<: *verify_template
  script:
    - pnpm run env:check

# ── 2. Integration & Contract Stage ─────────────────────────────────────────
integration:
  <<: *verify_template
  stage: integration
  needs:
    - typecheck
    - lint
    - unit
    - env-check
  script:
    - pnpm run test:integration

contract-brokers:
  <<: *verify_template
  stage: integration
  needs:
    - typecheck
    - unit
  script:
    - pnpm run test:contract
  rules:
    - changes:
        - src/events/**/*
        - tests/contract/**/*
    - if: $CI_PIPELINE_SOURCE == "schedule"

# ── 3. Security Stage ───────────────────────────────────────────────────────
security:
  <<: *verify_template
  stage: security
  needs:
    - typecheck
  script:
    - pnpm run secret:scan
    - pnpm audit --omit=dev --audit-level=high

# ── 4. Multi-Arch Build Stage ───────────────────────────────────────────────
build-multiarch:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  needs:
    - typecheck
    - lint
    - unit
    - integration
    - security
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache nodejs npm curl git
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --use
  script:
    - echo "Logging in to Docker Registry..."
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
    - echo "Building and pushing multi-arch Docker image (amd64, arm64)..."
    - |
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --push \
        -t $DOCKER_IMAGE \
        -t $DOCKER_IMAGE_LATEST \
        -f Dockerfile \
        .
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/

# ── 5. Deploy Staging (Automatic on main) ───────────────────────────────────
deploy-staging:
  stage: deploy-staging
  image: alpine:latest
  needs:
    - build-multiarch
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Connecting to staging server and deploying tag ${CI_COMMIT_SHORT_SHA}..."
    - |
      ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST \
        "cd ~/server-setup/esma && \
        chmod +x ./deploy/deploy.sh && \
        DEPLOY_TAG=${CI_COMMIT_SHORT_SHA} ./deploy/deploy.sh"
    - echo "Staging deployment completed successfully"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: on_success

# ── 6. Deploy Production (Manual approval for release tags) ────────────────
deploy-production:
  stage: deploy-production
  image: alpine:latest
  needs:
    - build-multiarch
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts
  script:
    - echo "Deploying release ${CI_COMMIT_TAG} to production server..."
    - |
      ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST \
        "cd ~/server-setup/esma && \
        chmod +x ./deploy/deploy.sh && \
        DEPLOY_TAG=${CI_COMMIT_TAG} ./deploy/deploy.sh"
    - echo "Production deployment completed successfully"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+/
  when: manual
